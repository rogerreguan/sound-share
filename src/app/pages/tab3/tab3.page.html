<ion-header [translucent]="true">
  <ion-toolbar color="green">
    <ion-title>
      My Profile
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 3</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-text>email: {{ email }}</ion-text><br>
  <ion-text>Username: {{username}}</ion-text><br>

  <ion-button (click)="signOut()">Cerrar Sesión</ion-button>
  <h1>Tus Posts</h1>
  <section class="results">
    <app-section-album *ngFor="let post of ListPosts" [iPost]="post"></app-section-album>
  </section>
</ion-content>
