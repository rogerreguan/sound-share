<section class="listing">
  <!-- <h3>{{getTime().getHours()}}:{{getTime().getMinutes()}}h</h3> -->
  <!-- <h3 class="listing-location">{{ iPost.dateTime?.getHours() }}:{{ iPost.dateTime?.getMinutes()}}h</h3> -->
  <h2 id="title" class="listing-heading">{{ iPost.album?.title }}</h2>
  <img src={{iPost.album?.image}}>
  <div id="details">
    <p class="listing-location">Artist: {{ iPost.album?.artist?.name }}</p>
    <p class="listing-location">Released: {{ iPost.album?.releasedate }}</p>
    <p class="listing-location">Rating: {{ iPost.stars }}</p>
  </div>
  <p class="listing-location">{{ iPost.user }} says:</p>
  <p id="opinion" class="listing-location">{{ iPost.opinion }}</p>
  <div id="buttons">
    <ion-button class="button" size="small" shape="round" color="success" fill="clear" [routerLink]="['/post', iPost.id]">
      <i id="more" class="icon ion-md-more"></i>
    </ion-button>
    <ion-button class="button" size="small" shape="round" color="success" fill="clear" (click)="shareContent()">
      <i id="share" class="icon ion-md-share"></i>
    </ion-button>
    <ion-button id="delete" size="small" shape="round" color="success" fill="clear" *ngIf="iPost.user === this.username" (click)="DeletePost()">
      <i id="trash" class="icon ion-md-trash"></i>
    </ion-button>
  </div>
  <!-- <p class="listing-location" *ngIf="iPost.actiu === true">Disponible: Si</p>
  <p class="listing-location" *ngIf="iPost.actiu === false">Disponible: No</p> -->
  <!-- <p class="listing-location">{{ iAlbum.user}}</p> -->
</section>
